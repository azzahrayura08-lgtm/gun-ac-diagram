name: Build GUN AC Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"
      - "sas-fuse-&-relay-diagram.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "sas-fuse-&-relay-diagram.zip" -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -type f -name package.json -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "package.json tidak ditemukan di dalam ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extracted/**/package-lock.json

      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Add Capacitor Android support
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/cli --no-audit --no-fund
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sas.gunac",
            "appName": "GUN AC",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sync Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/GUN-AC.apk"

      - name: Upload GUN AC APK
        uses: actions/upload-artifact@v4
        with:
          name: GUN-AC-APK
          path: GUN-AC.apk
          if-no-files-found: error
          retention-days: 14
